<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Admin Dashboard</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fff0f5;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ff477e;
            text-shadow: 2px 2px 0px rgba(255, 71, 126, 0.2);
            margin-bottom: 10px;
        }
        .stats {
            color: #ff85a1;
            font-weight: 700;
            margin-bottom: 30px;
            font-size: 1.2rem;
        }
        .container {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(255, 71, 126, 0.15);
            width: 100%;
            max-width: 900px;
            overflow-x: auto;
            display: none; /* Hidden until authenticated */
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 15px;
            border-bottom: 1px solid #ffe5ec;
        }
        th {
            background-color: #ffb3c6;
            color: white;
            font-weight: 700;
        }
        tr:nth-child(even) {
            background-color: #fff5f8;
        }
        tr:hover {
            background-color: #ffe5ec;
        }
        .loading {
            text-align: center;
            font-weight: 500;
            color: #ff477e;
        }
        .auth-container {
            text-align: center;
            margin-top: 50px;
        }
        button {
            background: #ff477e;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 126, 0.3);
            transition: all 0.2s;
        }
        button:hover {
            background: #d81b60;
            transform: translateY(-2px);
        }
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ffb3c6;
            padding: 8px 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>Admin Dashboard 🕵️‍♀️</h1>
    <div id="stats" class="stats"></div>

    <!-- Login Section -->
    <div id="auth-section" class="auth-container">
        <p>You must be an authorized admin to view this page.</p>
        <button id="btn-login">Sign in with Google</button>
    </div>

    <!-- Dashboard Section -->
    <button id="btn-logout" class="logout-btn" style="display: none;">Logout</button>
    <div id="dashboard" class="container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Visit Time</th>
                    <th>Browser</th>
                    <th>Device</th>
                </tr>
            </thead>
            <tbody id="visitor-list">
                <tr>
                    <td colspan="4" class="loading">Loading visitors...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        // Import Firebase from our centralized config
        import { db, auth, provider } from "./firebase-config.js";
        
        // Import Firestore and Auth functions
        import { collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
        import { signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        // UI Elements
        const authSection = document.getElementById("auth-section");
        const dashboard = document.getElementById("dashboard");
        const visitorList = document.getElementById("visitor-list");
        const btnLogin = document.getElementById("btn-login");
        const btnLogout = document.getElementById("btn-logout");
        const stats = document.getElementById("stats");

        // The exact email allowed to access this page
        const ADMIN_EMAIL = "poornap307@gmail.com";

        // Listen for authentication state changes
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in
                if (user.email === ADMIN_EMAIL) {
                    // Allowed Admin
                    authSection.style.display = "none";
                    dashboard.style.display = "block";
                    btnLogout.style.display = "block";
                    fetchVisitors();
                } else {
                    // Unauthorized User
                    alert(`Access denied for ${user.email}. Only the admin can view this page.`);
                    signOut(auth).then(() => {
                        window.location.href = "index.html"; // Redirect to homepage
                    });
                }
            } else {
                // User is signed out
                authSection.style.display = "block";
                dashboard.style.display = "none";
                btnLogout.style.display = "none";
                stats.textContent = "";
            }
        });

        // Login Button logic
        btnLogin.addEventListener("click", () => {
            signInWithPopup(auth, provider)
                .catch((error) => {
                    console.error("Login failed:", error);
                    alert("Login failed. Did you configure Firebase Auth and add the domain to Authorized Domains?");
                });
        });

        // Logout Button logic
        btnLogout.addEventListener("click", () => {
            signOut(auth);
        });

        // Fetch data from Firestore
        async function fetchVisitors() {
            try {
                // Query: Order by timestamp descending (newest first)
                const q = query(collection(db, "visitors"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                visitorList.innerHTML = ""; // Clear loading text
                
                // Show total visitor count
                const totalVisitors = querySnapshot.size;
                stats.textContent = `Total Visitors: ${totalVisitors}`;

                if (querySnapshot.empty) {
                    visitorList.innerHTML = `<tr><td colspan="4" class="loading">No visitors yet!</td></tr>`;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const tr = document.createElement("tr");

                    // Format timestamp
                    let timeString = "Unknown time";
                    if (data.timestamp) {
                        const date = data.timestamp.toDate();
                        timeString = date.toLocaleString();
                    }

                    tr.innerHTML = `
                        <td><strong>${data.name || "Unknown"}</strong></td>
                        <td>${timeString}</td>
                        <td>${data.browser || "Unknown"}</td>
                        <td>${data.device || "Unknown"}</td>
                    `;
                    visitorList.appendChild(tr);
                });
            } catch (error) {
                console.error("Error fetching visitors:", error);
                visitorList.innerHTML = `<tr><td colspan="4" style="color:red; text-align:center;">Error loading data. Are the Firestore Security Rules set up correctly for the admin?</td></tr>`;
            }
        }
    </script>
</body>
</html>
